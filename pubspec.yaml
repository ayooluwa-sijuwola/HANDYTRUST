name: handy_trust
description: "HandyTrust - Nigeria's trusted service marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  # Injectable clock for the artisan countdowns (already resolved via the SDK).
  clock: ^1.1.2

  # State management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # Firebase — upgraded together as one interconnected group (see
  # design/V2_FIREBASE_WEBKIT_UPGRADE_REPORT.md) specifically to pull in
  # firebase_core_web >=3.10.0, whose changelog fixes exactly the WebKit
  # "load firebase-app.js before component bundles to avoid WebKit import
  # race" bug this upgrade targets.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  cloud_functions: ^6.3.6
  # RumptyCloud staging media: SHA-256 of an upload, verified server-side
  # against the stored bytes (functions/media.js).
  crypto: ^3.0.6

  # Networking
  dio: ^5.9.2

  # Security
  flutter_secure_storage: ^9.0.0

  # Media
  flutter_image_compress: ^2.2.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Payments (Paystack via WebView + REST)
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI / Animations
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  timeago: ^3.7.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  # Stage 7.1: test-only — builds JPEGs with GPS EXIF (already locked transitively).
  image: ^4.8.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/watermark-removed-WhatsApp Image 2026-08-03 at 13.55.31.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/images/stitch/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
    # Stage 8 (Stitch) design system. Plus Jakarta Sans (OFL, see
    # assets/fonts/PlusJakartaSans/OFL.txt) for headings; static Inter for body.
    - family: HtDisplay
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: HtText
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/static/Inter_18pt-ExtraBold.ttf
          weight: 800
